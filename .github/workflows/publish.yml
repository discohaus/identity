name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install export tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          python3 -m pip install pillow

      - name: Generate
        run: python3 generate.py

      - name: Check marks and README are committed
        run: |
          if [ -n "$(git status --porcelain -- README.md 'assets/*/*.svg')" ]; then
            echo "::error::stale output - run 'python3 generate.py' and commit"
            git status --short -- README.md 'assets/*/*.svg'
            exit 1
          fi

      - name: Purge jsDelivr @latest
        run: |
          python3 - > paths.json <<'PY'
          import json
          from generate import load_params, entity_files
          params = load_params()
          repo = "${{ github.repository }}"
          print(json.dumps({"path": [
              f"/gh/{repo}@latest/assets/{e['id']}/{name}"
              for e in params["entities"]
              for name in entity_files(e, params)
          ]}))
          PY
          curl -fsS -X POST https://purge.jsdelivr.net/ \
            -H 'Content-Type: application/json' --data @paths.json
